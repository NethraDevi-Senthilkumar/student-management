<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: green;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Edit Student</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Name</label>
        <input type="text" name="name"
               value="{{ student.name }}" required>

        <label>Email</label>
        <input type="email" name="email"
               value="{{ student.email }}" required>

        <label>Course</label>
        <input type="text" name="course"
               value="{{ student.course }}" required>

        <label>Age</label>
        <input type="number" name="age"
               value="{{ student.age }}"
               min="1" max="100" required>

        <button type="submit">Update Student</button>

        <a href="{% url 'home' %}">Cancel</a>

    </form>

</div>

</body>
</html>
