<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        a {
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .edit {
            background: green;
            color: white;
        }

        .delete {
            background: red;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <div class="box">

        <h2>Add Student</h2>

        <form method="POST" action="{% url 'add_student' %}">

            {% csrf_token %}

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Course</label>
            <input type="text" name="course" required>

            <label>Age</label>
            <input type="number" name="age" min="1" max="100" required>

            <button type="submit">Add Student</button>

        </form>

    </div>

    <div class="box">

        <h2>Student List</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Age</th>
                <th>Action</th>
            </tr>

            {% for student in students %}

            <tr>

                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.course }}</td>
                <td>{{ student.age }}</td>

                <td>

                    <a class="edit"
                       href="{% url 'edit_student' student.id %}">
                       Edit
                    </a>

                    <a class="delete"
                       href="{% url 'delete_student' student.id %}"
                       onclick="return confirm('Delete this student?')">
                       Delete
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="6">No students available</td>
            </tr>

            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
